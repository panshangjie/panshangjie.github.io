# =========================================================
# Site Settings
# =========================================================

locale: "en-US"

title: "Shangjie Pan"
title_separator: "-"
name: &name "Shangjie Pan"

description: &description >
  Associate Professor at Hefei University of Technology.
  Research interests include Trusted Execution Environments,
  RISC-V security, and secure computer systems.

url: "https://panshangjie.github.io"
baseurl: ""

repository: "panshangjie/panshangjie.github.io"

breadcrumbs: false
words_per_minute: 160
future: true

# =========================================================
# Site Author
# =========================================================

author:
  name: "Shangjie Pan（潘尚杰）"
  avatar: "潘尚杰.jpg"

  bio: "Specially Appointed Associate Professor"

  location: "Hefei, Anhui, China"

  employer: "Hefei University of Technology"

  email: panshangjie@hfut.edu.cn

  googlescholar:
  github:
  orcid:


# =========================================================
# Reading Files
# =========================================================

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# =========================================================
# Markdown
# =========================================================

markdown: kramdown
highlighter: rouge

excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo


# =========================================================
# Collections
# =========================================================

collections:

  teaching:
    output: true
    permalink: /:collection/:path/

  publications:
    output: true
    permalink: /:collection/:path/


# =========================================================
# Defaults
# =========================================================

defaults:

  # Pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  # Teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true

  # Publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true


# =========================================================
# Sass / SCSS
# =========================================================

sass:
  sass_dir: _sass
  style: compressed


# =========================================================
# URLs
# =========================================================

permalink: /:categories/:title/

timezone: Asia/Shanghai


# =========================================================
# Plugins
# =========================================================

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji


# =========================================================
# HTML Compression
# =========================================================

compress_html:
  clippings: all
  ignore:
    envs: development
